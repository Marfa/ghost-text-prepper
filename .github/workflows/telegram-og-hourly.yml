name: Telegram OG fix (frequent)

on:
  schedule:
    # +1h Telegram delay after publish — 30 min is enough to convert PNG → .jpg og_image
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back window in hours"
        required: true
        default: "2"
      slug:
        description: "Optional single post slug to fix"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  telegram-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fix Telegram OG images
        env:
          GHOST_URL: ${{ vars.GHOST_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          FIX_TELEGRAM_OG: "1"
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$SLUG" ]; then
            python app.py --fix-telegram-og-slug "$SLUG"
          else
            HOURS="${{ github.event.inputs.hours || '2' }}"
            python app.py --fix-telegram-og-recent "$HOURS"
          fi
